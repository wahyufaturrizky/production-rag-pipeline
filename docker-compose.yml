services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 2s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      RAG_STORE: pgvector
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      RAG_EMBEDDINGS: ${RAG_EMBEDDINGS:-hash}
      RAG_EMBED_DIM: ${RAG_EMBED_DIM:-384}
      RAG_LLM: ${RAG_LLM:-extractive}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports: ["8000:8000"]

volumes:
  pgdata:
