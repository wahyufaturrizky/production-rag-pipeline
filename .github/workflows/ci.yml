name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-eval:
    name: Lint, unit tests + RAG eval gate (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest
      - name: RAG eval gate (in-memory store, offline models)
        run: rag eval
      - if: always()
        run: cat reports/rag_eval.md >> "$GITHUB_STEP_SUMMARY"

  pgvector-integration:
    name: Integration on PostgreSQL + pgvector
    runs-on: ubuntu-latest
    needs: test-and-eval
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pgvector integration tests
        run: pytest -m pg
      - name: RAG eval gate on pgvector
        run: RAG_STORE=pgvector rag eval --out reports/pg
      - if: always()
        run: cat reports/pg/rag_eval.md >> "$GITHUB_STEP_SUMMARY"
      - name: Docker build
        run: docker build -t production-rag-pipeline .
