[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag-pipeline"
version = "0.1.0"
description = "Production-minded RAG: idempotent ingestion, pgvector hybrid search (dense + full-text, RRF), re-ranking, cited grounded answers, refusal and an eval gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wahyu Fatur Rizky" }]
keywords = ["rag", "retrieval-augmented-generation", "pgvector", "hybrid-search", "bm25", "reranking", "langchain", "gemini", "fastapi", "llm"]
dependencies = [
  "numpy>=1.26",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "langchain-text-splitters>=0.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
dev = ["pytest>=8", "ruff>=0.5", "psycopg[binary]>=3.2", "pgvector>=0.3"]

[project.scripts]
rag = "rag.cli:main"

[project.urls]
Homepage = "https://github.com/wahyufaturrizky/production-rag-pipeline"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["pg: needs a PostgreSQL + pgvector database (DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py310"
